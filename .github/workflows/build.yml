name: Build Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Uji unit
        run: ./gradlew --no-daemon testDebugUnitTest

      # Build pengujian: tanpa kunci tanda tangan, tidak untuk dibagikan ke
      # siswa (server mode Wajib akan menolaknya bila CBT_APP_SECRET diisi).
      - name: Build APK debug
        if: env.IS_RELEASE != 'true'
        run: ./gradlew --no-daemon assembleDebug

      - name: Unggah APK debug
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cbt-teladan-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Cocokkan tag dengan versi aplikasi
        if: env.IS_RELEASE == 'true'
        run: |
          VERSION=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          TAG="${GITHUB_REF_NAME#v}"
          case "$TAG" in
            "$VERSION"|"$VERSION"-*) echo "Versi $VERSION, tag $GITHUB_REF_NAME" ;;
            *) echo "::error::Tag $GITHUB_REF_NAME tidak cocok dengan appVersionName $VERSION"; exit 1 ;;
          esac

      - name: Siapkan keystore rilis
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 belum diisi (lihat README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CBT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK rilis
        if: env.IS_RELEASE == 'true'
        env:
          CBT_APP_SECRET: ${{ secrets.CBT_APP_SECRET }}
          CBT_REQUIRE_SECRET: "1"
          CBT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CBT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CBT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "CBT-Teladan-${GITHUB_REF_NAME#v}.apk"

      - name: Terbitkan rilis
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: CBT-Teladan-*.apk
          prerelease: ${{ contains(github.ref_name, '-') }}
